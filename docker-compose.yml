version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # StockSense Backend API Service (FastAPI + SQLite WAL Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stocksense-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent named volume for SQLite database & uploaded document attachments
      - stocksense-data:/app/data
    environment:
      - ENVIRONMENT=production
      - SQLITE_DATABASE_PATH=data/stocksense.db
      - SQLITE_TIMEOUT=15.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stocksense-network

  # ----------------------------------------------------------------------------
  # StockSense Frontend UI Service (React 18 SPA + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stocksense-network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  stocksense-data:
    name: stocksense_storage
    driver: local

networks:
  stocksense-network:
    name: stocksense_net
    driver: bridge
